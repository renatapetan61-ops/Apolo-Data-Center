[workspace]
resolver = "2"
members = ["crates/ax-node-agent", "crates/ax-core", "crates/ax-scheduler", "crates/ax-storage", "crates/ax-ingestion", "crates/ax-compute"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
