name: Android APK Build
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_READY: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 != '' && secrets.APOLO_RELEASE_STORE_PASSWORD != '' && secrets.APOLO_RELEASE_KEY_ALIAS != '' && secrets.APOLO_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare persistent release signing key
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apolo-release.jks"
          test -s "$RUNNER_TEMP/apolo-release.jks"
      - name: Build and verify signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        working-directory: android
        env:
          APOLO_RELEASE_STORE_FILE: ${{ runner.temp }}/apolo-release.jks
          APOLO_RELEASE_STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          APOLO_RELEASE_KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          APOLO_RELEASE_KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Explain why signed release was skipped
        if: env.RELEASE_SIGNING_READY != 'true'
        run: |
          echo "::notice::Release APK was not built: configure the four APOLO_RELEASE_* repository secrets with one persistent keystore. The debug APK is signed by the Android debug key and is installable for testing."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apolo-data-center-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apolo-data-center-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
