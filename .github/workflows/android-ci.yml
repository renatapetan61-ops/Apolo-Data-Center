name: Android APK Build
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_READY: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 != '' && secrets.APOLO_RELEASE_STORE_PASSWORD != '' && secrets.APOLO_RELEASE_KEY_ALIAS != '' && secrets.APOLO_RELEASE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare persistent release signing key
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apolo-release.jks"
          test -s "$RUNNER_TEMP/apolo-release.jks"
      - name: Build and verify signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        working-directory: android
        env:
          APOLO_RELEASE_STORE_FILE: ${{ runner.temp }}/apolo-release.jks
          APOLO_RELEASE_STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          APOLO_RELEASE_KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          APOLO_RELEASE_KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.apolo.datacenter'" "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
      - name: Explain why signed release was skipped
        if: env.RELEASE_SIGNING_READY != 'true'
        run: |
          echo "::error::Release APK not generated: configure all four APOLO_RELEASE_* repository secrets."
          exit 1
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apolo-data-center-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apolo-data-center-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apolo-data-center-v0.2.0-build-${{ github.run_number }}
          name: APOLO Data Center Android v0.2.0 (build ${{ github.run_number }})
          body: |
            APK Release assinado do APOLO Data Center.
            
            Instalação: baixe o arquivo APK em Assets e abra-o no Android.
            Arquitetura: APK universal; não restringe o pacote a uma ABI específica.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
